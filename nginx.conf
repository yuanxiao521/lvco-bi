# =====================================================================
# 生产反向代理（A 方案：传输层强制加密）
#
# - 80 端口只做两件事：ACME 验证、其它请求 301 到 HTTPS
# - 443 终止 TLS，并向后端传 X-Forwarded-Proto: https（后端 REQUIRE_HTTPS 依赖它）
# - HSTS 一年 + nosniff + SAMEORIGIN：数据库密码不再有任何明文传输路径
#
# 证书放在 ./certs（compose 挂载到 /etc/nginx/certs）：
#   certs/server.crt / certs/server.key
# 自签（内网）：openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout certs/server.key -out certs/server.crt -subj "/CN=lvco-bi.local"
# =====================================================================

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 验证（续期时用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端据此判断"请求是否走了 HTTPS"（REQUIRE_HTTPS=true 时）
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/v1/ai/ {
        proxy_pass http://backend:8000/api/v1/ai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
