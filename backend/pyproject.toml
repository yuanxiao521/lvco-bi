[project]
name = "lvco-bi-backend"
version = "0.1.0"
description = "LvcoBI 后端服务 - FastAPI + SQLAlchemy + DuckDB"
requires-python = ">=3.10,<3.14"

dependencies = [
    # ── Web 框架 ─────────────────────────────────────────
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9",

    # ── 数据访问 ─────────────────────────────────────────
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",

    # ── DuckDB + 业务 ────────────────────────────────────
    "duckdb>=0.10.0",
    "pandas>=2.0.0",

    # ── HTTP / LLM ───────────────────────────────────────
    "httpx>=0.27.0,<1.0.0",

    # ── 可观测性 ─────────────────────────────────────────
    "structlog>=24.1.0",
    "langfuse>=2.0.0,<3.0.0",

    # ── 安全 / 认证 ──────────────────────────────────────
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",

    # ── Redis / 缓存 ─────────────────────────────────────
    "redis>=5.0.0",

    # ── 任务调度 ─────────────────────────────────────────
    "apscheduler>=3.10.0",

    # ── 限流 / 工具 ──────────────────────────────────────
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx[test]>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]