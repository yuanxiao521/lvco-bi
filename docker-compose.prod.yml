version: '3.8'

services:
  frontend:
    # Remove dev-only source mount and hot reload
    volumes: []
    command: []  # Use Dockerfile CMD instead
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always

  backend:
    # Remove dev-only source mount and --reload
    volumes: []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvco} -d ${POSTGRES_DB:-lvco_bi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    restart: always
    # A 方案：对外只暴露 80（跳转）/ 443（TLS）；证书从 ./certs 挂进来
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  certbot_www:
